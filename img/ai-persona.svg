<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e9e9"/><stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111"/><stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- stacked generated frames -->
  <rect x="150" y="95" width="300" height="380" fill="#cfcfcf" stroke="#222" stroke-width="3" transform="rotate(-8 300 285)"/>
  <rect x="150" y="95" width="300" height="380" fill="#dcdcdc" stroke="#222" stroke-width="3" transform="rotate(5 300 285)"/>
  <rect x="150" y="95" width="300" height="380" fill="#f4f4f4" stroke="#111" stroke-width="4"/>
  <!-- profile silhouette -->
  <path d="M330 472 L330 395 C300 395 285 385 282 365 L262 360 L270 340 L255 330 L272 305 C262 250 290 175 360 170 C410 168 430 205 430 250 C430 300 410 330 395 350 L400 472 Z" fill="url(#face)"/>
  <!-- neural mesh over head -->
  <g stroke="#f4f4f4" stroke-opacity=".7" stroke-width="2" fill="none">
    <polyline points="310,230 350,205 395,215 410,255 380,285 340,270 310,230"/>
    <line x1="350" y1="205" x2="340" y2="270"/><line x1="395" y1="215" x2="380" y2="285"/>
    <line x1="350" y1="205" x2="380" y2="285"/>
  </g>
  <g fill="#f4f4f4">
    <circle cx="310" cy="230" r="5"/><circle cx="350" cy="205" r="5"/><circle cx="395" cy="215" r="5"/>
    <circle cx="410" cy="255" r="5"/><circle cx="380" cy="285" r="5"/><circle cx="340" cy="270" r="5"/>
  </g>
  <!-- sparkles -->
  <g fill="#111">
    <path d="M205 165 L213 190 L238 198 L213 206 L205 231 L197 206 L172 198 L197 190 Z"/>
    <path d="M225 290 L230 305 L245 310 L230 315 L225 330 L220 315 L205 310 L220 305 Z"/>
  </g>
  <!-- pipeline strip: prompt -> LLM -> LoRA -> publish -->
  <g stroke="#111" stroke-width="3" fill="#f4f4f4">
    <rect x="95" y="515" width="70" height="44" rx="6"/>
    <rect x="215" y="515" width="70" height="44" rx="6"/>
    <rect x="335" y="515" width="70" height="44" rx="6"/>
    <rect x="455" y="515" width="50" height="44" rx="6" fill="#111"/>
  </g>
  <g stroke="#111" stroke-width="3">
    <line x1="165" y1="537" x2="210" y2="537"/><line x1="285" y1="537" x2="330" y2="537"/><line x1="405" y1="537" x2="450" y2="537"/>
  </g>
  <path d="M472 527 L492 537 L472 547 Z" fill="#f4f4f4"/>
  <path d="M110 525 L150 537 L110 549 L118 537 Z" fill="#111"/>
  <text x="250" y="544" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#111">LLM</text>
  <text x="370" y="544" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#111">LoRA</text>
</svg>
