  <polyline points="80,470 170,425 230,445 290,400 350,375 410,385 520,300" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 8"/>
  <path d="M500 300 L522 298 L515 320" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
  <line x1="70" y1="530" x2="530" y2="530" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
