<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#grid)"/>
  <!-- agent network -->
  <g stroke="#fff" stroke-opacity=".55" stroke-width="2">
    <line x1="150" y1="130" x2="300" y2="90"/><line x1="300" y1="90" x2="450" y2="130"/>
    <line x1="150" y1="130" x2="300" y2="200"/><line x1="450" y1="130" x2="300" y2="200"/>
    <line x1="300" y1="90" x2="300" y2="200"/>
  </g>
  <g fill="#0c0c0c" stroke="#fff" stroke-width="4">
    <circle cx="150" cy="130" r="26"/><circle cx="300" cy="90" r="26"/>
    <circle cx="450" cy="130" r="26"/><circle cx="300" cy="200" r="32"/>
  </g>
  <g fill="#fff">
