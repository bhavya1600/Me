    <line x1="230" y1="410" x2="230" y2="490"/><line x1="290" y1="350" x2="290" y2="450"/>
    <line x1="350" y1="330" x2="350" y2="420"/><line x1="410" y1="345" x2="410" y2="430"/>
    <line x1="470" y1="300" x2="470" y2="390"/>
  </g>
  <g stroke="#fff" stroke-width="3">
    <rect x="94" y="420" width="32" height="60" fill="#0c0c0c"/>
    <rect x="154" y="400" width="32" height="50" fill="#fff"/>
    <rect x="214" y="425" width="32" height="45" fill="#0c0c0c"/>
    <rect x="274" y="370" width="32" height="60" fill="#fff"/>
    <rect x="334" y="350" width="32" height="50" fill="#fff"/>
    <rect x="394" y="365" width="32" height="45" fill="#0c0c0c"/>
