    <circle cx="450" cy="130" r="9"/><circle cx="300" cy="200" r="13"/>
  </g>
  <line x1="300" y1="232" x2="300" y2="282" stroke="#fff" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- candlesticks -->
  <g stroke="#fff" stroke-width="3">
